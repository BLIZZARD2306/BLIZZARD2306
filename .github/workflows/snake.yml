# Draws the contribution-graph snake in the profile README's aurora colors.
# Output SVGs are pushed to the "output" branch, which the README links to.
name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1b3a7a&color_dots=#ebedf0,#b8e7f5,#7fc8e8,#2fa6c9,#1b3a7a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7fe3c4&color_dots=#161b22,#0e2a4d,#1b3a7a,#1f8a9e,#2fd6a8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
